services:
  # ローカル開発用PostgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: inventory-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventory_dev
      POSTGRES_PASSWORD: dev_password_2025
      POSTGRES_DB: inventory_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=en_US.UTF-8"
    ports:
      - "5437:5432"  # ローカルポート5437にマッピング
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory-network

volumes:
  postgres_data:
    driver: local

networks:
  inventory-network:
    driver: bridge
